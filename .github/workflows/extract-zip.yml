name: Extract ZIP into Repository

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          echo "ZIP files found:"
          find . -maxdepth 2 -type f \( -iname "*.zip" \) -print

      - name: Extract CRAM AI ZIP
        run: |
          ZIP_FILE="CRAM-AI-VERCEL-READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Move files to repository root
        run: |
          shopt -s dotglob
          cp -rf extracted/* .
          rm -rf extracted
          rm -f "CRAM-AI-VERCEL-READY.zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract CRAM AI ZIP into repository"
            git push
          fi
