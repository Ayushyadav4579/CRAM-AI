name: Promote verified CRAM AI training artifact

on:
  push:
    branches: [agent/cram-ai-model-pipeline]
    paths:
      - ".github/workflows/promote-trained-model.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cram-ai-promote-trained-model
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current model pipeline
        uses: actions/checkout@v4
        with:
          ref: agent/cram-ai-model-pipeline
          persist-credentials: true

      - name: Retrieve completed fine-tuning artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39614669571 --repo "$GITHUB_REPOSITORY" --name cram-ai-training-run-39614669571 --dir /tmp/cram-training
          test -s /tmp/cram-training/model-artifacts/cram-ai-smollm/adapter_model.safetensors
          test -s /tmp/cram-training/model-artifacts/cram-ai-smollm/training_metadata.json
          test -s /tmp/cram-training/model-artifacts/evaluation.json
          mkdir -p model-artifacts
          cp -a /tmp/cram-training/model-artifacts/cram-ai-smollm model-artifacts/
          cp /tmp/cram-training/model-artifacts/evaluation.json model-artifacts/evaluation.json

      - name: Verify adapter metadata and held-out evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("model-artifacts/cram-ai-smollm")
          meta = json.loads((p / "training_metadata.json").read_text())
          report = json.loads(Path("model-artifacts/evaluation.json").read_text())
          weights = p / "adapter_model.safetensors"
          assert weights.stat().st_size > 100_000, "Adapter weights are missing or unexpectedly small"
          assert (p / "TRAINING_FINISHED").is_file(), "Training completion marker is missing"
          assert meta.get("base_model") == "HuggingFaceTB/SmolLM2-135M-Instruct", meta.get("base_model")
          assert report.get("evaluated_examples", 0) >= 100, report.get("evaluated_examples")
          print(json.dumps({
            "adapter_bytes": weights.stat().st_size,
            "base_model": meta["base_model"],
            "training_rows": meta.get("training_rows"),
            "held_out_examples": report.get("evaluated_examples"),
            "held_out_mcq_accuracy": report.get("mcq_key_accuracy"),
            "held_out_exact_match": report.get("task_results", {}).get("mcq", {}).get("answer_text_exact_match_rate"),
            "note": "Metrics are reported as measured; no quality certification is implied."
          }, indent=2))
          PY

      - name: Smoke-test actual fine-tuned adapter through FastAPI
        run: |
          set -e
          MODEL_DIR="$PWD/model-artifacts/cram-ai-smollm" python - <<'PY'
          import json, os, subprocess, sys, time, urllib.error, urllib.request
          env = os.environ.copy()
          proc = subprocess.Popen([sys.executable, "-m", "uvicorn", "api:app", "--app-dir", "model-training", "--host", "127.0.0.1", "--port", "8765"], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          def get(url, payload=None, timeout=120):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, {"error":e.read().decode("utf-8","replace")[:1000]}
          try:
              health = None
              for _ in range(80):
                  if proc.poll() is not None:
                      raise SystemExit("FastAPI exited before startup")
                  try:
                      code, health = get("http://127.0.0.1:8765/health", timeout=5)
                      if code == 200 and health.get("model_loaded"):
                          break
                  except Exception:
                      pass
                  time.sleep(3)
              if not health or not health.get("model_loaded"):
                  raise SystemExit("Fine-tuned adapter failed health check: " + json.dumps(health))
              code, result = get("http://127.0.0.1:8765/generate", {"prompt":"In one short sentence, what is photosynthesis?","max_new_tokens":48,"temperature":0}, timeout=180)
              if code != 200 or not result.get("response","").strip():
                  raise SystemExit("Fine-tuned adapter generation failed: " + json.dumps({"status":code,"result":result}))
              print(json.dumps({"health":health,"generation_status":code,"sample_response":result["response"],"quality_status":result.get("quality_status","unverified")}, indent=2))
          finally:
              proc.terminate()
              try: proc.wait(timeout=10)
              except subprocess.TimeoutExpired: proc.kill()
          PY

      - name: Commit trained adapter and held-out report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-artifacts/cram-ai-smollm model-artifacts/evaluation.json
          git commit -m "Promote fine-tuned CRAM AI adapter with held-out evaluation"
          git fetch origin agent/cram-ai-model-pipeline
          git rebase origin/agent/cram-ai-model-pipeline
          git push origin HEAD:agent/cram-ai-model-pipeline
