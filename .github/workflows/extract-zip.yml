name: Extract ZIP into Repository

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          echo "ZIP files found:"
          find . -type f -iname "*.zip" -print

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Put extracted files in repository root
        run: |
          # Detect whether ZIP has one top-level folder
          shopt -s dotglob nullglob

          items=(extracted/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            echo "ZIP contains one top-level folder."
            cp -rf "${items[0]}"/* .
          else
            echo "ZIP contains files directly."
            cp -rf extracted/* .
          fi

      - name: Remove ZIP and temporary files
        run: |
          rm -rf extracted
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract project ZIP into repository"
            git push
          fi
