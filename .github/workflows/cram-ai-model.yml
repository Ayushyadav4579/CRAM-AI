name: CRAM AI model training (free CPU runner)

on:
  push:
    branches:
      - agent/cram-ai-model-pipeline
    paths:
      # Only changes that affect training/data should consume a full CPU training run.
      # API, evaluator, tests, docs, and deployment changes are verified separately.
      - "model-training/train.py"
      - "model-training/prepare_public_dataset.py"
      - "model-training/dataset_pipeline.py"
      - "model-training/requirements.txt"
      - "model-training/data/**"
      - ".github/workflows/cram-ai-model.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cram-ai-model-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out existing CRAM AI repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model-training/requirements.txt

      - name: Install training and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model-training/requirements.txt pytest

      - name: Compile and test dataset tooling
        run: |
          python -m compileall -q model-training
          pytest -q model-training/tests

      - name: Prepare the full available licensed ARC train/validation/test splits
        run: |
          python model-training/prepare_public_dataset.py \
            --output-dir model-training/data/public \
            --max-train-questions 100000 \
            --max-validation-questions 100000 \
            --max-test-questions 100000
          cat model-training/data/public/dataset_metadata.json

      - name: Restore resumable checkpoints
        uses: actions/cache@v4
        with:
          path: model-artifacts/cram-ai-smollm.staging/checkpoints
          key: cram-ai-checkpoints-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cram-ai-checkpoints-${{ github.ref_name }}-

      - name: Fine-tune the same SmolLM2 base model used by the deployed API on all licensed ARC training questions (one CPU epoch)
        run: |
          python model-training/train.py \
            --dataset model-training/data/public/train.jsonl \
            --eval-dataset model-training/data/public/validation.jsonl \
            --model-id HuggingFaceTB/SmolLM2-135M-Instruct \
            --output model-artifacts/cram-ai-smollm \
            --epochs 1 \
            --max-length 256 \
            --resume
          cp model-training/data/public/dataset_metadata.json model-artifacts/cram-ai-smollm/dataset_metadata.json

      - name: Evaluate on untouched test questions
        run: |
          python model-training/evaluate.py \
            --model model-artifacts/cram-ai-smollm \
            --dataset model-training/data/public/test.jsonl \
            --report model-artifacts/evaluation.json \
            --limit 400
          cat model-artifacts/evaluation.json

      - name: Quality-gate the real FastAPI model endpoint
        run: python model-training/smoke_test_api.py

      - name: Save quality-gated trained artifacts and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-artifacts/cram-ai-smollm model-artifacts/evaluation.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit."
          else
            git commit -m "Store CRAM AI SmolLM2 retrained adapter and strict evaluation"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ] || printf '%s\n' "$conflicted" | grep -Ev '^(model-artifacts/cram-ai-smollm(/|$)|model-artifacts/evaluation\.json$)' | grep -q .; then
                echo "Unsafe rebase conflict outside the generated model artifacts:"
                printf '%s\n' "$conflicted"
                git rebase --abort
                exit 1
              fi
              # The rebased commit contains the freshly trained artifacts; prefer them
              # only for artifact paths while retaining the latest source-code changes.
              git checkout --theirs -- model-artifacts/cram-ai-smollm model-artifacts/evaluation.json
              git add model-artifacts/cram-ai-smollm model-artifacts/evaluation.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi


      - name: Preserve model, evaluation, and API logs as a downloadable workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cram-ai-training-run-${{ github.run_id }}
          path: |
            model-artifacts/cram-ai-smollm/
            model-artifacts/evaluation.json
            model-artifacts/api-smoke.log
            model-training/data/public/dataset_metadata.json
          if-no-files-found: warn
          retention-days: 90
